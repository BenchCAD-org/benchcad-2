name: credits-board
# Station 7 of the lifecycle (CONTRIBUTING.md, 📒): after a family PR merges, check
# whether CONTRIBUTORS.md still matches the actual issue/PR provenance records.
#
# POLICY: bots never push to main (the ruleset requires a PR for every change and
# github-actions[bot] deliberately has no bypass). This job therefore only
# regenerates the board and WARNS when the committed copy has drifted — a
# maintainer regenerates and pushes it (see .github/scripts/gen_credits.py).
#
# `pull_request_target`, not `pull_request`: fork PRs (every contributor PR) get a
# read-only GITHUB_TOKEN under `pull_request` regardless of `permissions:`, which
# broke this job on #35/#36/#38/#74. Safe: fires only after merge, checks out
# `main`, and runs main's own script — no PR-supplied code executes. NEVER check
# out or execute PR-head code in this workflow.

on:
  pull_request_target:
    types: [closed]
    paths: ["designs/**"]
  workflow_dispatch:

jobs:
  credits:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: regenerate CONTRIBUTORS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_credits.py
      - name: warn if the committed board is stale
        run: |
          git diff --quiet -- CONTRIBUTORS.md || echo "::warning::CONTRIBUTORS.md is stale. Maintainer: run .github/scripts/gen_credits.py and push the refresh (bots do not push to main by policy)."
