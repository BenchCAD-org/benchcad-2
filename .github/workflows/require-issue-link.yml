name: require-issue-link
# Station 3 of the lifecycle (CONTRIBUTING.md): a family PR must link its family issue
# (`Closes #N`) — otherwise merge won't close the issue and dossier.yml
# can't post the acceptance evidence back to it.
#
# `check` is a REQUIRED status check (repo ruleset), so it must report on EVERY
# PR. It therefore runs on all PRs (no `paths` filter) and passes immediately for
# a non-family PR (nothing under designs/), enforcing the link only for family PRs.
#
# It also gates the PR body's image links, because a review is worthless when the
# renders don't load. Every image url must resolve, and anything under designs/
# must be pinned to a commit SHA — a branch name is not a pin: the image dies the
# moment the branch is deleted (which is what happens to a fork branch right after
# its PR merges) or the family dir is renamed. Covers markdown `![alt](url)` AND
# raw `<img src="url">`, since the latter is what you must write to set a width.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # the image check reads blobs via getContent
      issues: read
      pull-requests: read
    steps:
      - name: family PR body must contain a closing keyword + issue number
        uses: actions/github-script@v7
        with:
          script: |
            // Only family PRs (touching designs/) must link an issue.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, per_page: 100 });
            if (!files.some(f => f.filename.startsWith('designs/'))) {
              core.info('Not a family PR (no designs/ changes) — issue link not required.');
              return;
            }
            const body = context.payload.pull_request.body || '';
            const m = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!m) {
              core.setFailed(
                'PR description must link its family issue, e.g. `Closes #12` ' +
                '(CONTRIBUTING.md station 3). Edit the PR description — no new push needed. ' +
                '/ PR 描述里需要写 `Closes #<issue编号>` 关联 family issue,' +
                '直接编辑 PR 描述即可,不用重新 push。');
              return;
            }
            const n = Number(m[1]);
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: n });
              if (issue.pull_request)
                core.setFailed(`#${n} is a pull request, not an issue — link the family issue.`);
              else if (issue.state !== 'open')
                core.setFailed(`Issue #${n} is already closed — is this family already merged?`);
              else
                core.info(`links open issue #${n}: ${issue.title}`);
            } catch (e) {
              core.setFailed(`Issue #${n} does not exist in this repo (typo?).`);
            }
      - name: PR-body images must be SHA-pinned links that resolve
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // An image reaches the body two ways and BOTH must be gated: markdown
            // `![alt](url)` and raw `<img src="url">` (what you must use to set a
            // width). A markdown-only extractor is why the sibling repo's gate sat
            // green on two PRs whose previews were 404ing — it found zero URLs.
            const urls = [...new Set([
              ...[...body.matchAll(/!\[[^\]]*\]\(\s*([^)\s]+)/g)].map(m => m[1]),
              ...[...body.matchAll(/<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["']/gi)].map(m => m[1]),
            ])];

            const strip = u => u.replace(/[?#].*$/, '');

            // Any GitHub-hosted blob, INCLUDING a contributor fork — a fork-hosted
            // preview is exactly the kind that rots, so it gets verified too.
            const parse = (u) => {
              const s = strip(u);
              let m = s.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/([^/]+)\/(.+)$/);
              if (m) return { o: m[1], r: m[2], ref: m[3], path: m[4] };
              m = s.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
              if (m) return { o: m[1], r: m[2], ref: m[3], path: m[4] };
              return null;   // user-attachments upload / camo-proxied — GitHub-hosted, durable
            };

            const isSha = r => /^[0-9a-f]{7,40}$/i.test(r);
            const broken = [], moving = [], movingRefs = [];
            let checked = 0;

            for (const u of urls) {
              const p = parse(u);
              if (!p) continue;
              checked++;
              // A branch name is not a pin. Under designs/ it is a guaranteed future
              // 404 (fork branches get deleted after merge, family dirs get renamed),
              // so it fails; a docs/assets/refs image only rots if the asset is
              // renamed, so it warns.
              if (!isSha(p.ref)) {
                (p.path.startsWith('designs/') ? moving : movingRefs).push(`${p.path} @ ${p.ref}`);
              }
              try {
                await github.rest.repos.getContent({
                  owner: p.o, repo: p.r, path: decodeURIComponent(p.path), ref: p.ref });
              } catch (e) {
                if (e.status === 403) {   // >1 MB blob, or a repo we cannot read — cannot verify
                  core.info(`skipped ${p.o}/${p.r} ${p.path}: ${e.message}`);
                  continue;
                }
                broken.push(`${p.o}/${p.r} ${p.path} @ ${p.ref.slice(0, 9)}`);
              }
            }

            for (const m of movingRefs) {
              core.warning(
                `image pinned to a moving ref: ${m} — re-pin to the commit sha. A branch ref ` +
                'silently breaks the image the moment the asset is renamed or the branch is deleted. ' +
                '/ 图片钉在分支名上,请改钉 commit sha,否则文件一改名/分支一删图就碎。');
            }

            const errs = [];
            if (broken.length) {
              errs.push(
                `image url(s) that do not resolve: ${broken.join('; ')} — re-pin to a commit that ` +
                'actually contains the file. If the family dir was renamed (e.g. to the `_asm` form), ' +
                'the previews live at the NEW path only from the rename commit onward — bump every ' +
                'image url to the new head sha. ' +
                '/ 图片链接打不开:若刚把目录改名(如 _asm),预览图只在改名那个 commit 之后才有新路径,' +
                '请把所有图片 url 的 sha 一并更新到最新 head。');
            }
            if (moving.length) {
              errs.push(
                `designs/ image(s) pinned to a branch instead of a commit sha: ${moving.join('; ')} — ` +
                'your fork branch is deleted when this PR merges and every one of those images dies ' +
                'with it, leaving the merged PR unreviewable. Copy the sha from the branch and use ' +
                'blob/<sha>/<path>?raw=true. ' +
                '/ designs/ 下的图片钉在分支名上:本 PR 合并后 fork 分支会被删除,这些图会全部失效,' +
                '请改用 blob/<sha>/<path>?raw=true。');
            }
            if (errs.length) {
              core.setFailed(errs.join(' || ') + ' Edit the PR description — no new push needed.');
            } else {
              core.info(`all ${checked} repo-hosted image link(s) OK (${urls.length} image url(s) in body)`);
            }
