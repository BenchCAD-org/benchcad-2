name: family-pr-checks
# Hard structural gates for a family PR, on top of:
#   validate.yml            — the design actually runs (bench2 validate)
#   require-issue-link.yml  — the body links its family issue (Closes #N)
# This job enforces the "one family = one PR" scope and that the family ships a
# complete package. The one exception is a metadata-only sweep — a diff whose
# designs/ side is spec.py files only, which can move no geometry and no
# committed render — so repo-wide upkeep is one PR instead of N identical ones
# (step 0). Complete package: its three source files AND the three committed renders
# (the easy/medium/hard grid, the four benchmark views, and the min/max
# extremes). Requirements a human used to eyeball are now red/green.
# `preview_hard_zoom.png` (the fourth render, front/side/top/iso of a hard
# example) is WARNED about, not required, until the PRs that predate it have
# backfilled it and main is clean — then step 3b moves into step 3's list.
#
# It also enforces that the PR BODY shows its evidence: the reference images
# re-embedded from the family issue, all four renders embedded by name, the
# parameter/verification table, and — for a multi-body family — the per-part
# render preview_parts.png (file + embed).
#
# It runs on EVERY PR (no `paths` filter) and passes immediately for a non-family
# PR, so it is safe to add to the repo ruleset's required checks (context name:
# `family-pr-checks`) without leaving docs/CI-only PRs stuck "Expected — waiting".

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  family-pr-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the base to diff changed files
      - name: one-family scope + required files + package whitelist
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          DIFF=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"; echo "$DIFF" | sed 's/^/  /'

          FAMS=$(echo "$DIFF" | grep -oE '^designs/[^/]+/' | cut -d/ -f2 | sort -u || true)
          NF=$(echo "$FAMS" | grep -c . || true)

          # non-family PR (nothing under designs/): nothing to gate — pass
          if [ "$NF" -eq 0 ]; then
            echo "Not a family PR (no designs/ changes) — family-pr-checks passes as a no-op."
            exit 0
          fi

          # 0) a metadata-only SWEEP may span families: it changes nothing under
          # designs/ except spec.py files, so no part.py, no family.json and no
          # committed render can move — the geometry and the acceptance images
          # are untouchable by construction. That is what repo-wide upkeep looks
          # like (dropping a spec key the framework no longer reads), and it
          # would otherwise arrive as N near-identical PRs that differ only in
          # the family name. validate still runs on every family in the sweep.
          # Only designs/ scope is judged here; this gate has never restricted
          # paths outside designs/ (a pure framework PR passes as a no-op above).
          DESIGN_NONSPEC=$(echo "$DIFF" | grep -E '^designs/' | grep -vE '^designs/[^/]+/spec\.py$' | grep . || true)
          if [ "$NF" -gt 1 ] && [ -z "$DESIGN_NONSPEC" ]; then
            echo "Metadata-only sweep across ${NF} families ($(echo $FAMS)) — designs/ diff is spec.py only, so one-family scope is waived."
            exit 0
          fi

          # 1) exactly one designs/<family>/ touched
          if [ "$NF" -ne 1 ]; then
            echo "::error::A family PR must touch exactly ONE designs/<family>/ (found ${NF}: $(echo $FAMS)). One family = one PR — split it."
            exit 1
          fi
          FAM="$FAMS"

          # 2) nothing outside that family dir (a new geomlib helper is the one exception)
          STRAY=$(echo "$DIFF" | grep -vE "^designs/${FAM}/" | grep -vE '^framework/bench2/geomlib/' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::A family PR touches only designs/${FAM}/ (adding a bench2.geomlib helper is the sole exception). Remove from this PR: $(echo $STRAY)"
            exit 1
          fi

          # 3) the family ships all six required files (3 source + 3 renders)
          MISSING=""
          for f in part.py spec.py family.json preview.png preview_views.png preview_extremes.png; do
            [ -f "designs/${FAM}/${f}" ] || MISSING="${MISSING} ${f}"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::designs/${FAM}/ is missing required file(s):${MISSING}"
            echo "::error::Source (part.py/spec.py/family.json) is required; run 'uv run bench2 preview ${FAM}' and commit preview.png + preview_views.png + preview_extremes.png (the easy/medium/hard grid, the four benchmark views, and the min/max extremes)."
            exit 1
          fi

          # 3a) a multi-body family (family.json declares "solids") must also
          # ship the per-part render — every component individually verifiable.
          if grep -qE '"solids"|"components"' "designs/${FAM}/family.json" 2>/dev/null; then
            if [ ! -f "designs/${FAM}/preview_parts.png" ]; then
              echo "::error::designs/${FAM}/ declares a multi-body family (\"solids\" in family.json) but has no preview_parts.png — render every component in isolation next to the assembly and commit it."
              exit 1
            fi
          fi

          # 3b) the fourth render — front/side/top/iso of a hard example. `bench2
          # preview` emits it, but PRs branched before that landed cannot have it,
          # so warn (don't fail) until the backlog and main are backfilled.
          if [ ! -f "designs/${FAM}/preview_hard_zoom.png" ]; then
            echo "::warning::designs/${FAM}/preview_hard_zoom.png is missing. Rebase on main, re-run 'uv run bench2 preview ${FAM}' and commit the fourth render (front/side/top/iso of a hard example) — the diagonal benchmark views hide axis-aligned features. This becomes a hard requirement once the in-flight PRs have it."
          fi

          # 4) nothing but the package goes into designs/<family>/ — reference
          # PDFs/photos/scans belong in the family ISSUE, not the repo. Checked
          # on the files this PR adds/modifies (deletions are fine).
          ADDED=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" | grep -E "^designs/${FAM}/" | sed "s|^designs/${FAM}/||" || true)
          JUNK=$(echo "$ADDED" | grep -vE '^(part\.py|spec\.py|family\.json|NOTES\.md|preview\.png|preview_views\.png|preview_hard_zoom\.png|preview_extremes\.png|preview_parts\.png)$' | grep . || true)
          if [ -n "$JUNK" ]; then
            echo "::error::designs/${FAM}/ must contain only the family package (part.py, spec.py, family.json, NOTES.md, preview.png, preview_views.png, preview_hard_zoom.png, preview_extremes.png, and preview_parts.png for assemblies). Reference drawings/photos/datasheets go in the family issue instead. Remove from this PR: $(echo $JUNK)"
            exit 1
          fi

          echo "OK — family='${FAM}': one-family scope clean, all six required files present, no stray files."
      # Two things a human used to catch by hand, now red/green with an exact
      # fix in the message: the PR checklist actually completed, and the family
      # dir named the same as the family issue it closes.
      - name: checklist completed + issue/family name coherence
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, per_page: 100 });
            const fams = [...new Set(files.filter(f => f.filename.startsWith('designs/'))
              .map(f => f.filename.split('/')[1]).filter(Boolean))];
            if (fams.length !== 1) { core.info('not a single-family PR — handled by the scope step'); return; }
            const fam = fams[0];
            const body = context.payload.pull_request.body || '';

            // ── the PR body must SHOW its evidence ─────────────────────────
            // (a) all four renders embedded by name (alt text or URL); the
            //     hard-zoom name is only required once the file exists.
            const fs = require('fs');
            const missing = [];
            const wantNames = ['preview_views.png', 'preview_extremes.png', 'preview_hard_zoom.png'];
            for (const name of wantNames) {
              if (name === 'preview_hard_zoom.png' && !fs.existsSync(`designs/${fam}/preview_hard_zoom.png`)) continue;
              if (!body.includes(name)) missing.push(name);
            }
            if (!/(?<![\w_])preview\.png/.test(body)) missing.push('preview.png');
            if (missing.length) {
              core.setFailed(
                `The PR body must embed every render by name (paste the template's image lines; keep the filename in the alt text or URL). Missing: ${missing.join(', ')}. `);
            }
            // (b) the reference images from the family issue, re-embedded
            const refSec = body.match(/##\s*Reference[\s\S]*?(?=\n##\s|$)/i);
            const refImgs = refSec ? ((refSec[0].match(/!\[|<img/g)) || []).length : 0;
            if (refImgs < 2) {
              core.setFailed(
                'The PR body needs a "## Reference" section re-embedding the family issue\'s dimensioned drawing AND photo (2+ images), so reviewers compare renders against the reference in one place. ');
            }
            // (c) the parameter / verification table
            if (!/^\s*\|.*\|/m.test(body)) {
              core.setFailed(
                'The PR body needs the parameter/verification table (markdown table): the issue\'s dimension rows, plus per-instance verification for what you sampled. ');
            }
            // (d) multi-body: the per-part render embedded too
            try {
              const fj = JSON.parse(fs.readFileSync(`designs/${fam}/family.json`, 'utf8'));
              const isAssembly = (fj.solids || 0) >= 2
                || (Array.isArray(fj.components) && fj.components.length > 0);
              if (isAssembly && !body.includes('preview_parts.png')) {
                core.setFailed(
                  'Multi-body family: embed preview_parts.png (each component rendered in isolation next to the assembly) in the PR body. ');
              }
            } catch (e) { core.info('family.json parse skipped: ' + e.message); }

            const unchecked = (body.match(/^\s*-\s*\[ \]/gm) || []).length;
            if (unchecked > 0) {
              core.setFailed(
                `The PR checklist has ${unchecked} unchecked item(s). Complete every item (honestly — CI re-runs validate) ` +
                `and tick it by editing the PR description; no new push needed. Not done yet? Mark the PR as a Draft. `);
            }
            const m = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (m) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(m[1]) });
                const t = (issue.title || '').match(/\[(?:family|proposal)\]\s*([a-z0-9_]+)/i);
                if (t && t[1] !== fam) {
                  core.setFailed(
                    `This PR changes designs/${fam}/ but links issue #${m[1]} ("${t[1]}"). The family dir, ` +
                    `family.json "family", and the issue name must match exactly — rename one side or fix the Closes line. `);
                }
              } catch (e) { core.info('issue lookup skipped: ' + e.message); }
            }
