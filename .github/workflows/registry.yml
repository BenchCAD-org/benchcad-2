name: registry
# Keep registry.json (the duplicate-check index) fresh: every family/category
# issue change and every designs/ merge regenerates it.

on:
  issues:
    types: [opened, edited, closed, reopened]
  push:
    branches: [main]
    paths: ["designs/**"]
  workflow_dispatch:

jobs:
  regen:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'family') || contains(github.event.issue.labels.*.name, 'category')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # BOT_PUSH_TOKEN: repo-admin fine-grained PAT (Contents read/write, this
          # repo only). Admins bypass the main ruleset; github-actions[bot] cannot
          # (GH013, and the built-in Actions app cannot be put on the bypass list).
          token: ${{ secrets.BOT_PUSH_TOKEN != '' && secrets.BOT_PUSH_TOKEN || github.token }}
      - name: regenerate registry.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_registry.py
      - name: commit if changed
        run: |
          git config user.name "benchcad-bot"
          git config user.email "actions@github.com"
          git add registry.json
          # commit BEFORE pulling: `git pull --rebase` aborts on a dirty index
          # (staged registry.json), so staging then rebasing exits 128 and the
          # refresh is never pushed. Same order as credits.yml.
          git diff --cached --quiet && exit 0
          git commit -m "registry: refresh [skip ci]"
          git pull --rebase origin main
          git push || echo "::warning::registry.json refresh not pushed — the main ruleset rejects github-actions[bot] (GH013). Add the BOT_PUSH_TOKEN secret or refresh manually."
